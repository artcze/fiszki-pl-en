name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Astro types
        run: npx astro sync

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit and API tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase
        run: npx supabase start

      - name: Database tests
        run: npx supabase test db

      - name: Create E2E environment
        shell: bash
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"

          if [[ -z "${API_URL:-}" || -z "${ANON_KEY:-}" ]]; then
            echo "Could not obtain local Supabase E2E configuration."
            exit 1
          fi

          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_KEY=$ANON_KEY"
            echo "LIBRETRANSLATE_BASE_URL=http://127.0.0.1:54330"
          } > .env.e2e

      - name: E2E test
        run: npm run test:e2e
